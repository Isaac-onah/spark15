<div class="space-y-6">
  <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Platform Fee Configuration</h1>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    
    <!-- Current Fee Card -->
    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl shadow-md p-6 text-white relative overflow-hidden">
      <div class="relative z-10">
        <h2 class="text-lg font-medium text-indigo-100 mb-1">Current Active Fee</h2>
        <div class="text-4xl font-bold mb-4">
          <span *ngIf="feeType() === 'flat'">{{ feeAmount() | currencyEur }}</span>
          <span *ngIf="feeType() === 'percentage'">{{ feeAmount() }}%</span>
        </div>
        <p class="text-sm text-indigo-100 bg-white/20 inline-block px-3 py-1 rounded-full">
          {{ feeType() | titlecase }} Fee Structure
        </p>
      </div>
      <svg class="absolute -bottom-10 -right-10 w-48 h-48 text-white opacity-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
    </div>

    <!-- Configuration Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-bold text-gray-900 mb-4">Fee Structure Settings</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fee Type</label>
          <select [(ngModel)]="feeType" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
            <option value="flat">Flat Fee (EUR)</option>
            <option value="percentage">Percentage (%)</option>
            <option value="tiered">Tiered (Complex)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fee Amount</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="text-gray-500 sm:text-sm" *ngIf="feeType() === 'flat'">€</span>
            </div>
            <input type="number" [(ngModel)]="feeAmount" class="focus:ring-indigo-500 focus:border-indigo-500 block w-full border-gray-300 rounded-md p-2 border" [class.pl-7]="feeType() === 'flat'">
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
              <span class="text-gray-500 sm:text-sm" *ngIf="feeType() === 'percentage'">%</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4" *ngIf="feeType() === 'percentage'">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Minimum Cap (€)</label>
            <input type="number" [(ngModel)]="minCap" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Maximum Cap (€)</label>
            <input type="number" [(ngModel)]="maxCap" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
          </div>
        </div>

        <div class="pt-4 border-t border-gray-100 mt-4">
          <button (click)="saveSettings()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:text-sm">
            Save Fee Settings
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mt-6">
    <h2 class="text-lg font-bold text-gray-900 mb-4">Payment Provider Configuration</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="space-y-4">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-indigo-600" fill="currentColor" viewBox="0 0 24 24"><path d="M14.6 9.8c-.8-.6-2-.9-3.5-.9-1.9 0-3.3.4-4.3 1.2C5.9 10.9 5.4 12 5.4 13.4c0 1.2.4 2.1 1.2 2.7.8.6 1.9.9 3.2.9 2 0 3.6-.4 4.7-1.3l-.6-2.5c-.9.6-2 .9-3.3.9-1.3 0-2.3-.3-2.9-.8-.6-.6-.9-1.3-.9-2.3 0-.9.3-1.6.9-2.1.6-.5 1.5-.7 2.7-.7.9 0 1.6.2 2.1.5l1.1-2.9zM18.6 5H5.4C4.1 5 3 6.1 3 7.4v9.2C3 17.9 4.1 19 5.4 19h13.2c1.3 0 2.4-1.1 2.4-2.4V7.4C21 6.1 19.9 5 18.6 5zM19 16.6c0 .2-.2.4-.4.4H5.4c-.2 0-.4-.2-.4-.4V7.4c0-.2.2-.4.4-.4h13.2c.2 0 .4.2.4.4v9.2z"></path></svg>
            <h3 class="font-medium text-gray-900">Stripe Integration</h3>
          </div>
          <app-status-badge status="active"></app-status-badge>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Secret Key</label>
          <input type="password" [(ngModel)]="stripeKey" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2 bg-gray-50">
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-gray-900" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path></svg>
            <h3 class="font-medium text-gray-900">Revolut Integration</h3>
          </div>
          <div class="flex items-center h-5">
            <input type="checkbox" [(ngModel)]="revolutEnabled" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300 rounded cursor-pointer">
            <label class="ml-2 text-sm text-gray-600">Enabled</label>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
          <input type="password" placeholder="rev_************************" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2" [disabled]="!revolutEnabled()">
        </div>
      </div>
    </div>
    
    <div class="mt-6 flex justify-end">
      <button (click)="saveProviderSettings()" class="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-gray-900 text-base font-medium text-white hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 sm:text-sm">
        Save Provider Configuration
      </button>
    </div>
  </div>
</div>
