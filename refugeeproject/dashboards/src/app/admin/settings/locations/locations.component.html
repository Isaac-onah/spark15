<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Settings', route: '/admin/settings'}, {label: 'Locations'}]"></app-breadcrumb>

  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Locations</h1>
    <button (click)="openAddModal()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
      Add Location
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let loc of locations()" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col justify-between">
      <div>
        <h3 class="text-lg font-semibold text-gray-900">{{loc.neighborhood}}</h3>
        <p class="text-sm text-gray-500">{{loc.name}}</p>
      </div>
      <div class="mt-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <button type="button" (click)="loc.enabled = !loc.enabled"
            [class.bg-emerald-500]="loc.enabled" [class.bg-gray-200]="!loc.enabled"
            class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
            <span aria-hidden="true" [class.translate-x-5]="loc.enabled" [class.translate-x-0]="!loc.enabled"
              class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
          </button>
          <span class="text-sm text-gray-600">{{loc.enabled ? 'Active' : 'Disabled'}}</span>
        </div>
        <div class="flex space-x-3">
          <button (click)="editLocation(loc)" class="text-sm text-indigo-600 hover:text-indigo-900">Edit</button>
          <button (click)="deleteLocation(loc)" class="text-sm text-rose-600 hover:text-rose-900">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isModalOpen()" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" aria-hidden="true" (click)="isModalOpen.set(false)"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
      <div class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
        <div>
          <h3 class="text-lg font-medium leading-6 text-gray-900">Add / Edit Location</h3>
          <div class="mt-4 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">City</label>
              <input type="text" [(ngModel)]="editingLocation().name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Neighborhood</label>
              <input type="text" [(ngModel)]="editingLocation().neighborhood" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-gray-700">Enabled</span>
              <button type="button" (click)="editingLocation().enabled = !editingLocation().enabled"
                [class.bg-indigo-600]="editingLocation().enabled" [class.bg-gray-200]="!editingLocation().enabled"
                class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                <span aria-hidden="true" [class.translate-x-5]="editingLocation().enabled" [class.translate-x-0]="!editingLocation().enabled"
                  class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
          <button type="button" (click)="saveLocation()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:col-start-2 sm:text-sm">
            Save
          </button>
          <button type="button" (click)="isModalOpen.set(false)" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:col-start-1 sm:text-sm">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
