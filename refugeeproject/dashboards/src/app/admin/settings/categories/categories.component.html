<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Settings', route: '/admin/settings'}, {label: 'Categories & Services'}]"></app-breadcrumb>

  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Categories & Services</h1>
    <button (click)="openAddModal()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
      Add Category
    </button>
  </div>

  <div class="space-y-4">
    <div *ngFor="let cat of categories(); let i = index" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <div class="flex flex-col space-y-1">
          <button (click)="moveUp(i)" class="text-gray-400 hover:text-indigo-600">▲</button>
          <span class="text-xs text-center text-gray-500">{{cat.order}}</span>
          <button (click)="moveDown(i)" class="text-gray-400 hover:text-indigo-600">▼</button>
        </div>
        <div class="text-3xl">{{cat.icon}}</div>
        <div>
          <h3 class="text-lg font-medium text-gray-900">{{cat.name}}</h3>
          <div class="mt-1 flex flex-wrap gap-2">
            <span *ngFor="let sub of cat.subServices" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
              {{sub}}
            </span>
          </div>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <button type="button" (click)="cat.enabled = !cat.enabled"
          [class.bg-emerald-500]="cat.enabled" [class.bg-gray-200]="!cat.enabled"
          class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
          <span aria-hidden="true" [class.translate-x-5]="cat.enabled" [class.translate-x-0]="!cat.enabled"
            class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
        </button>
        <button (click)="editCategory(cat)" class="text-gray-400 hover:text-indigo-600">Edit</button>
        <button (click)="deleteCategory(cat)" class="text-gray-400 hover:text-rose-600">Delete</button>
      </div>
    </div>
  </div>

  <div *ngIf="isModalOpen()" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" aria-hidden="true" (click)="isModalOpen.set(false)"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
      <div class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
        <div>
          <h3 class="text-lg font-medium leading-6 text-gray-900">Add / Edit Category</h3>
          <div class="mt-4 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Name</label>
              <input type="text" [(ngModel)]="editingCategory().name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Icon (Emoji)</label>
              <input type="text" [(ngModel)]="editingCategory().icon" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Sub-Services (comma separated)</label>
              <input type="text" [value]="editingCategory().subServices.join(', ')" (change)="editingCategory().subServices = $any($event.target).value.split(',')" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-gray-700">Enabled</span>
              <button type="button" (click)="editingCategory().enabled = !editingCategory().enabled"
                [class.bg-indigo-600]="editingCategory().enabled" [class.bg-gray-200]="!editingCategory().enabled"
                class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                <span aria-hidden="true" [class.translate-x-5]="editingCategory().enabled" [class.translate-x-0]="!editingCategory().enabled"
                  class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
          <button type="button" (click)="saveCategory()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:col-start-2 sm:text-sm">
            Save
          </button>
          <button type="button" (click)="isModalOpen.set(false)" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:col-start-1 sm:text-sm">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
