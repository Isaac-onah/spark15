<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Settings', route: '/admin/settings'}, {label: 'Email Templates'}]"></app-breadcrumb>

  <div class="border-b border-gray-200">
    <nav class="-mb-px flex space-x-8">
      <button *ngFor="let cat of categories" (click)="activeCategory.set(cat)"
        [class.border-indigo-500]="activeCategory() === cat" [class.text-indigo-600]="activeCategory() === cat"
        [class.border-transparent]="activeCategory() !== cat" [class.text-gray-500]="activeCategory() !== cat"
        class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm capitalize hover:text-gray-700 hover:border-gray-300">
        {{cat}}
      </button>
    </nav>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <ng-container *ngFor="let tmpl of templates()">
      <div *ngIf="activeCategory() === 'All' || activeCategory() === tmpl.category" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col justify-between hover:shadow-md transition-shadow">
        <div>
          <div class="flex justify-between items-start">
            <h3 class="text-lg font-semibold text-gray-900">{{tmpl.name}}</h3>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 capitalize">{{tmpl.category}}</span>
          </div>
          <p class="text-sm text-gray-600 mt-2 font-medium">Subject: {{tmpl.subject}}</p>
        </div>
        <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-4">
          <p class="text-xs text-gray-500">Last edited {{tmpl.lastEdited}} by {{tmpl.editedBy}}</p>
          <button (click)="editTemplate(tmpl)" class="text-sm text-indigo-600 hover:text-indigo-900 font-medium">Edit</button>
        </div>
      </div>
    </ng-container>
  </div>

  <div *ngIf="isModalOpen()" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" aria-hidden="true" (click)="isModalOpen.set(false)"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
      <div class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full sm:p-6">
        <div>
          <h3 class="text-lg font-medium leading-6 text-gray-900">Edit Template: {{editingTemplate()?.name}}</h3>
          <div class="mt-4 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Subject</label>
              <input type="text" [(ngModel)]="editingTemplate().subject" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Body (HTML / Text)</label>
              <textarea [(ngModel)]="editingTemplate().body" rows="12" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm font-mono"></textarea>
            </div>
          </div>
        </div>
        <div class="mt-5 sm:mt-6 flex justify-end space-x-3">
          <button type="button" (click)="isModalOpen.set(false)" class="inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:text-sm">
            Cancel
          </button>
          <button type="button" (click)="saveTemplate()" class="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:text-sm">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
