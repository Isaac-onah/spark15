<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Reports', route: '/admin/reports'}, {label: 'Pre-Built Reports'}]"></app-breadcrumb>

  <h1 class="text-2xl font-bold text-gray-900">Pre-Built Reports</h1>

  <div *ngIf="!selectedReport()" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let r of reports" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col justify-between hover:shadow-md transition">
      <div>
        <div class="flex justify-between items-start mb-4">
          <div class="text-3xl">{{r.icon}}</div>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">{{r.freq}}</span>
        </div>
        <h3 class="text-lg font-semibold text-gray-900">{{r.name}}</h3>
        <p class="text-sm text-gray-500 mt-2">{{r.desc}}</p>
      </div>
      <button (click)="selectReport(r)" class="mt-6 w-full inline-flex justify-center items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-indigo-700 bg-indigo-50 hover:bg-indigo-100">
        Generate Report
      </button>
    </div>
  </div>

  <div *ngIf="selectedReport()" class="space-y-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <button (click)="selectedReport.set(null)" class="text-gray-400 hover:text-indigo-600">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
        <h2 class="text-xl font-bold text-gray-900">{{selectedReport().icon}} {{selectedReport().name}}</h2>
      </div>
      <div class="flex space-x-3 items-center">
        <input type="date" [(ngModel)]="dateRange.start" class="rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        <span class="text-gray-500">to</span>
        <input type="date" [(ngModel)]="dateRange.end" class="rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        <button (click)="exportCsv()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">Export CSV</button>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-64 flex items-center justify-center bg-gray-50">
      <p class="text-gray-400 font-medium">[ Chart Visualization Placeholder for {{selectedReport().name}} ]</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Period</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Metric 1</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Metric 2</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let row of mockData">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{row.label}}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{row.value1}}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{row.value2}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
