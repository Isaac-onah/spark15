<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Admin Team', route: '/admin/team'}, {label: 'Team Members'}]"></app-breadcrumb>

  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Team Members <span class="text-sm font-normal text-gray-500 ml-2">({{team().length}} total)</span></h1>
    <button (click)="isInviteModalOpen.set(true)" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
      Invite Admin
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Member</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Login</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let user of team()" [class.border-l-4]="user.role === 'super_admin'" [class.border-l-purple-500]="user.role === 'super_admin'">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
                {{user.avatar}}
              </div>
              <div class="ml-4">
                <div class="text-sm font-medium text-gray-900">{{user.name}}</div>
                <div class="text-sm text-gray-500">{{user.email}}</div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
              [class.bg-purple-100]="user.role === 'super_admin'" [class.text-purple-800]="user.role === 'super_admin'"
              [class.bg-indigo-100]="user.role === 'admin'" [class.text-indigo-800]="user.role === 'admin'"
              [class.bg-blue-100]="user.role === 'moderator'" [class.text-blue-800]="user.role === 'moderator'"
              [class.bg-gray-100]="user.role === 'support_agent'" [class.text-gray-800]="user.role === 'support_agent'">
              {{user.role | uppercase}}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <app-status-badge [status]="user.status"></app-status-badge>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{user.lastLogin}}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button (click)="editRole(user)" class="text-indigo-600 hover:text-indigo-900 mr-3">Edit Role</button>
            <button *ngIf="user.role !== 'super_admin'" (click)="disableAdmin(user)" class="text-rose-600 hover:text-rose-900">Disable</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="isInviteModalOpen()" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 text-center sm:block sm:p-0">
      <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" (click)="isInviteModalOpen.set(false)"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
      <div class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
        <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Invite Team Member</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" [(ngModel)]="inviteData.email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Role</label>
            <select [(ngModel)]="inviteData.role" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              <option value="admin">Admin</option>
              <option value="moderator">Moderator</option>
              <option value="support_agent">Support Agent</option>
            </select>
          </div>
        </div>
        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
          <button type="button" (click)="inviteAdmin()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:col-start-2 sm:text-sm">Send Invitation</button>
          <button type="button" (click)="isInviteModalOpen.set(false)" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:col-start-1 sm:text-sm">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isEditModalOpen()" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 text-center sm:block sm:p-0">
      <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" (click)="isEditModalOpen.set(false)"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
      <div class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
        <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Edit Role for {{editingUser()?.name}}</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Role</label>
            <select [(ngModel)]="editingUser().role" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
              <option value="super_admin">Super Admin</option>
              <option value="admin">Admin</option>
              <option value="moderator">Moderator</option>
              <option value="support_agent">Support Agent</option>
            </select>
          </div>
        </div>
        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
          <button type="button" (click)="saveRole()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:col-start-2 sm:text-sm">Save Changes</button>
          <button type="button" (click)="isEditModalOpen.set(false)" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:col-start-1 sm:text-sm">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
