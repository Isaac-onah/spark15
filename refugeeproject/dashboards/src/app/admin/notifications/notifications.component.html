<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Notifications'}]"></app-breadcrumb>

  <div class="border-b border-gray-200">
    <nav class="-mb-px flex space-x-8">
      <button (click)="activeTab.set('mine')"
        [class.border-indigo-500]="activeTab() === 'mine'" [class.text-indigo-600]="activeTab() === 'mine'"
        [class.border-transparent]="activeTab() !== 'mine'" [class.text-gray-500]="activeTab() !== 'mine'"
        class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm hover:text-gray-700 hover:border-gray-300">
        My Notifications
      </button>
      <button (click)="activeTab.set('broadcast')"
        [class.border-indigo-500]="activeTab() === 'broadcast'" [class.text-indigo-600]="activeTab() === 'broadcast'"
        [class.border-transparent]="activeTab() !== 'broadcast'" [class.text-gray-500]="activeTab() !== 'broadcast'"
        class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm hover:text-gray-700 hover:border-gray-300">
        Broadcasts
      </button>
    </nav>
  </div>

  <div *ngIf="activeTab() === 'mine'" class="space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-semibold text-gray-900">Recent Alerts</h2>
      <button (click)="markAllRead()" class="text-sm text-indigo-600 hover:text-indigo-900">Mark All as Read</button>
    </div>
    
    <div class="space-y-3">
      <div *ngFor="let notif of myNotifications()" [class.bg-white]="notif.read" [class.bg-blue-50]="!notif.read" class="rounded-xl shadow-sm border border-gray-100 p-4 flex items-start relative cursor-pointer hover:shadow-md transition">
        <div *ngIf="!notif.read" class="absolute top-4 right-4 w-2 h-2 bg-blue-600 rounded-full"></div>
        <div class="flex-shrink-0 pt-1">
          <span *ngIf="notif.type === 'alert'" class="text-rose-500 text-xl">🚨</span>
          <span *ngIf="notif.type === 'info'" class="text-blue-500 text-xl">ℹ️</span>
          <span *ngIf="notif.type === 'success'" class="text-emerald-500 text-xl">✅</span>
          <span *ngIf="notif.type === 'warning'" class="text-amber-500 text-xl">⚠️</span>
        </div>
        <div class="ml-4 flex-1">
          <h3 class="text-sm font-semibold text-gray-900">{{notif.title}}</h3>
          <p class="text-sm text-gray-600 mt-1">{{notif.message}}</p>
          <p class="text-xs text-gray-400 mt-2">{{notif.timeAgo}}</p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="activeTab() === 'broadcast'" class="space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-semibold text-gray-900">Past & Scheduled Broadcasts</h2>
      <button (click)="isModalOpen.set(true)" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
        Create Broadcast
      </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Audience & Channels</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Recipients</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let b of broadcasts()">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{b.title}}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">{{b.audience}}</div>
              <div class="flex gap-1 mt-1">
                <span *ngFor="let ch of b.channels" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800">{{ch}}</span>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" [class.bg-emerald-100]="b.status === 'sent'" [class.text-emerald-800]="b.status === 'sent'" [class.bg-amber-100]="b.status === 'scheduled'" [class.text-amber-800]="b.status === 'scheduled'">{{b.status | uppercase}}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{b.date}}</td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm text-gray-500">{{b.recipients | number}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="isModalOpen()" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" (click)="isModalOpen.set(false)"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
      <div class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full sm:p-6">
        <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Create Broadcast</h3>
        <div class="space-y-4 text-left">
          <div>
            <label class="block text-sm font-medium text-gray-700">Title</label>
            <input type="text" [(ngModel)]="broadcastData.title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Message</label>
            <textarea [(ngModel)]="broadcastData.message" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Target Audience</label>
            <div class="space-y-2">
              <label class="inline-flex items-center mr-4"><input type="radio" name="aud" value="all_users" [(ngModel)]="broadcastData.audience" class="text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">All Users</span></label>
              <label class="inline-flex items-center mr-4"><input type="radio" name="aud" value="all_providers" [(ngModel)]="broadcastData.audience" class="text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">All Providers</span></label>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Channels</label>
            <div class="flex space-x-4">
              <label class="inline-flex items-center"><input type="checkbox" [(ngModel)]="broadcastData.channels.inApp" class="rounded text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">In-App</span></label>
              <label class="inline-flex items-center"><input type="checkbox" [(ngModel)]="broadcastData.channels.email" class="rounded text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">Email</span></label>
              <label class="inline-flex items-center"><input type="checkbox" [(ngModel)]="broadcastData.channels.sms" class="rounded text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">SMS</span></label>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Schedule</label>
            <div class="space-y-2">
              <label class="inline-flex items-center mr-4"><input type="radio" name="sch" value="now" [(ngModel)]="broadcastData.schedule" class="text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">Send Now</span></label>
              <label class="inline-flex items-center mr-4"><input type="radio" name="sch" value="later" [(ngModel)]="broadcastData.schedule" class="text-indigo-600 focus:ring-indigo-500"><span class="ml-2 text-sm">Schedule for later</span></label>
            </div>
            <input *ngIf="broadcastData.schedule === 'later'" type="datetime-local" class="mt-2 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          </div>
        </div>
        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
          <button type="button" (click)="sendBroadcast()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:col-start-2 sm:text-sm">
            {{broadcastData.schedule === 'now' ? 'Send Broadcast' : 'Schedule Broadcast'}}
          </button>
          <button type="button" (click)="isModalOpen.set(false)" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:col-start-1 sm:text-sm">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
