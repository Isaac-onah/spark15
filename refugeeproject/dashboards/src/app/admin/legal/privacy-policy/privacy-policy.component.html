<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Legal', route: '/admin/legal'}, {label: 'Privacy Policy'}]"></app-breadcrumb>

  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Privacy Policy</h1>
      <p class="text-sm text-gray-500 mt-1">Last updated {{lastUpdated}} by {{updatedBy}}</p>
    </div>
    <div class="space-x-3">
      <button class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">View History</button>
      <button (click)="savePolicy()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">Save Changes</button>
    </div>
  </div>

  <div class="flex gap-6">
    <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
      <div class="border-b border-gray-200 bg-gray-50 p-2 flex space-x-2">
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700 font-bold">B</button>
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700 italic">I</button>
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700 underline">U</button>
        <div class="w-px h-6 bg-gray-300 my-auto mx-2"></div>
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700 font-bold">H1</button>
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700 font-semibold">H2</button>
        <div class="w-px h-6 bg-gray-300 my-auto mx-2"></div>
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700">Link</button>
        <button class="p-2 hover:bg-gray-200 rounded text-gray-700">List</button>
      </div>
      <textarea [(ngModel)]="content" class="flex-1 w-full p-6 min-h-[500px] border-none resize-none focus:ring-0 font-mono text-sm text-gray-800"></textarea>
    </div>
    
    <div class="w-64 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
      <h3 class="text-sm font-semibold text-gray-900 mb-4">Version History</h3>
      <div class="space-y-4">
        <div *ngFor="let v of versions; let i = index" class="border-l-2 border-indigo-200 pl-3 relative">
          <div class="absolute w-2 h-2 bg-indigo-600 rounded-full -left-[5px] top-1.5"></div>
          <p class="text-sm font-medium text-gray-900">{{v.date}}</p>
          <p class="text-xs text-gray-500 mb-2">by {{v.author}}</p>
          <button *ngIf="i > 0" class="text-xs text-indigo-600 hover:text-indigo-900">Restore this version</button>
          <span *ngIf="i === 0" class="text-xs text-emerald-600 font-medium">Current Version</span>
        </div>
      </div>
    </div>
  </div>
</div>
