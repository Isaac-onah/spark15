<header class="h-16 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
  <div class="flex items-center gap-4">
    <button class="md:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100 focus:outline-none transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <div class="hidden sm:block">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
          <svg class="w-5 h-5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
        <input type="text" class="w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all" placeholder="Search...">
      </div>
    </div>
  </div>
  <div class="flex items-center space-x-5">
    <a routerLink="/admin/notifications" class="text-gray-400 hover:text-gray-600 relative transition-colors p-1.5 rounded-lg hover:bg-gray-100 cursor-pointer">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
      <span *ngIf="notificationService.getUnreadCount() > 0" class="absolute top-1 right-1 block h-4 w-4 rounded-full bg-red-500 ring-2 ring-white text-[10px] text-white flex justify-center items-center font-bold">
        {{ notificationService.getUnreadCount() }}
      </span>
    </a>
    <div class="h-8 w-px bg-gray-200"></div>
    <div class="flex items-center cursor-pointer group relative">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-100 to-blue-100 flex items-center justify-center text-indigo-700 font-bold shadow-sm border border-indigo-200 group-hover:shadow-md transition-all">
        {{ authService.currentUser()?.firstName?.charAt(0) || 'U' }}
      </div>
      <div class="ml-3 hidden sm:block">
        <p class="text-sm font-medium text-gray-700 group-hover:text-indigo-600 transition-colors">{{ authService.currentUser()?.name || 'User' }}</p>
        <p class="text-xs text-gray-500 capitalize">{{ authService.currentUser()?.role?.replace('_', ' ') || 'Role' }}</p>
      </div>
    </div>
  </div>
</header>
