<nav class="flex" aria-label="Breadcrumb">
  <ol role="list" class="flex items-center space-x-2">
    <li *ngFor="let item of items(); let last = last; let i = index" class="flex items-center">
      
      <!-- Separator -->
      <svg *ngIf="i > 0" class="h-5 w-5 flex-shrink-0 text-gray-400 mr-2" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
        <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
      </svg>
      
      <!-- Link -->
      <a *ngIf="!last && item.route" 
         [routerLink]="item.route" 
         class="text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">
        {{ item.label }}
      </a>
      
      <!-- Current Page -->
      <span *ngIf="last || !item.route" 
            class="text-sm font-medium text-gray-900" 
            [attr.aria-current]="last ? 'page' : null">
        {{ item.label }}
      </span>
    </li>
  </ol>
</nav>
