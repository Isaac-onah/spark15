<span *ngIf="variant() === 'pill'" 
      class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
      [ngClass]="colorClasses()">
  {{ displayLabel() }}
</span>

<span *ngIf="variant() === 'dot'" class="inline-flex items-center gap-1.5">
  <span class="h-1.5 w-1.5 rounded-full" [ngClass]="dotColorClasses()"></span>
  <span class="text-sm font-medium text-gray-700">{{ displayLabel() }}</span>
</span>
