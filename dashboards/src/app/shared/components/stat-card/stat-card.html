<div class="relative overflow-hidden rounded-xl bg-white p-6 shadow-sm ring-1 ring-gray-100 hover:shadow-md transition-shadow group">
  <div class="absolute right-0 top-0 -mr-8 -mt-8 h-32 w-32 rounded-full opacity-10 blur-2xl transition-opacity group-hover:opacity-20"
       [ngClass]="{
         'bg-indigo-500': color() === 'indigo',
         'bg-purple-500': color() === 'purple',
         'bg-emerald-500': color() === 'emerald',
         'bg-rose-500': color() === 'rose',
         'bg-blue-500': color() === 'blue',
         'bg-amber-500': color() === 'amber',
         'bg-orange-500': color() === 'orange'
       }">
  </div>

  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500">{{ title() }}</p>
      <div class="mt-2 flex items-baseline gap-2">
        <p class="text-3xl font-bold tracking-tight text-gray-900">{{ value() }}</p>
        
        <p *ngIf="trend()" 
           class="flex items-baseline text-sm font-semibold"
           [ngClass]="{
             'text-emerald-600': trendDirection() === 'up',
             'text-rose-600': trendDirection() === 'down',
             'text-gray-500': trendDirection() === 'neutral'
           }">
          <svg *ngIf="trendDirection() === 'up'" class="self-center flex-shrink-0 h-4 w-4 mr-0.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
          </svg>
          <svg *ngIf="trendDirection() === 'down'" class="self-center flex-shrink-0 h-4 w-4 mr-0.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 4.5l15 15m0 0V8.25m0 11.25H8.25" />
          </svg>
          {{ trend() }}
        </p>
      </div>
    </div>
    
    <div class="flex h-12 w-12 items-center justify-center rounded-xl"
         [ngClass]="{
           'bg-indigo-50 text-indigo-600': color() === 'indigo',
           'bg-purple-50 text-purple-600': color() === 'purple',
           'bg-emerald-50 text-emerald-600': color() === 'emerald',
           'bg-rose-50 text-rose-600': color() === 'rose',
           'bg-blue-50 text-blue-600': color() === 'blue',
           'bg-amber-50 text-amber-600': color() === 'amber',
           'bg-orange-50 text-orange-600': color() === 'orange'
         }">
      <svg *ngIf="icon() === 'chart'" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
      </svg>
      <svg *ngIf="icon() === 'users'" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
      </svg>
    </div>
  </div>
</div>
