<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Admin Team', route: '/admin/team'}, {label: 'Audit Log'}]"></app-breadcrumb>

  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Audit Log</h1>
    <button (click)="exportLog()" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
      Export CSV
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex gap-4">
    <div class="w-1/3">
      <label class="block text-xs font-medium text-gray-700">Admin</label>
      <select [(ngModel)]="filters.admin" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        <option value="">All Admins</option>
        <option value="Isaac Onah">Isaac Onah</option>
        <option value="Sarah Müller">Sarah Müller</option>
      </select>
    </div>
    <div class="w-1/3">
      <label class="block text-xs font-medium text-gray-700">Action Type</label>
      <select [(ngModel)]="filters.action" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        <option value="">All Actions</option>
        <option value="Update">Update</option>
        <option value="Delete">Delete</option>
        <option value="Approve">Approve</option>
      </select>
    </div>
    <div class="w-1/3">
      <label class="block text-xs font-medium text-gray-700">Date</label>
      <input type="date" [(ngModel)]="filters.date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Admin</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action & Target</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP Address</th>
          <th class="px-6 py-3"></th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <ng-container *ngFor="let log of logs()">
          <tr class="hover:bg-gray-50 cursor-pointer" (click)="log.expanded = !log.expanded">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{log.timestamp}}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{log.admin}}</div>
              <div class="text-xs text-gray-500">{{log.role}}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900 font-semibold">{{log.action}}</div>
              <div class="text-xs text-gray-500">{{log.target}}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono">{{log.ip}}</td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button class="text-gray-400 hover:text-gray-600">
                <svg [class.rotate-180]="log.expanded" class="h-5 w-5 transform transition-transform" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="log.expanded" class="bg-gray-50">
            <td colspan="5" class="px-6 py-4">
              <div class="text-sm font-mono text-gray-700 whitespace-pre-wrap">{{log.diff}}</div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
    <div class="px-6 py-3 border-t border-gray-200">
      <app-pagination [currentPage]="1" [totalItems]="50"></app-pagination>
    </div>
  </div>
</div>
