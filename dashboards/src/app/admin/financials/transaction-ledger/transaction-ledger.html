<div class="space-y-6">
  <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <h1 class="text-2xl font-bold text-gray-900">Transaction Ledger</h1>
    <button class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      Export CSV
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex flex-col sm:flex-row gap-4 items-center bg-gray-50">
      <app-search-input placeholder="Search ID, Ref, or Name..." (searchChanged)="onSearch($event)" class="w-full sm:w-64"></app-search-input>
      
      <select [(ngModel)]="typeFilter" class="w-full sm:w-48 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block sm:text-sm border-gray-300 rounded-md border p-2">
        <option value="all">All Types</option>
        <option value="escrow_funding">Escrow Funding</option>
        <option value="escrow_release">Escrow Release</option>
        <option value="fee_collection">Fee Collection</option>
        <option value="refund">Refund</option>
        <option value="payout">Payout</option>
      </select>

      <input type="date" class="w-full sm:w-48 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block sm:text-sm border-gray-300 rounded-md border p-2">
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Transaction ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type & Ref</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">From &rarr; To</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Details</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let t of filteredTransactions()">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ t.id }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <div class="capitalize text-gray-900 font-medium mb-1">{{ t.type.replace('_', ' ') }}</div>
              <div class="text-xs">Ref: {{ t.ref }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <div class="text-gray-900">{{ t.from }}</div>
              <div class="text-xs text-gray-400">&darr;</div>
              <div class="text-gray-900">{{ t.to }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{{ t.amount | currencyEur }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <app-status-badge [status]="t.status"></app-status-badge>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <div>{{ t.date | date:'short' }}</div>
              <div class="text-xs">{{ t.method }}</div>
              <div class="text-xs text-gray-400 mt-1">By: {{ t.by }}</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div class="px-6 py-4 border-t border-gray-100">
      <app-pagination [totalItems]="filteredTransactions().length" [pageSize]="10" [currentPage]="1"></app-pagination>
    </div>
  </div>
</div>
