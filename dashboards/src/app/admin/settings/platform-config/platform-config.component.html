<div class="space-y-6">
  <app-breadcrumb [items]="[{label: 'Dashboard', route: '/admin'}, {label: 'Settings', route: '/admin/settings'}, {label: 'Platform Configuration'}]"></app-breadcrumb>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-900">General</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Platform Name</label>
          <input type="text" [(ngModel)]="config().platformName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Currency</label>
          <select [(ngModel)]="config().currency" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="EUR">EUR (€)</option>
            <option value="USD">USD ($)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Default Language</label>
          <select [(ngModel)]="config().defaultLanguage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="de">German</option>
            <option value="en">English</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Supported Languages</label>
          <div class="space-y-2">
            <label class="inline-flex items-center mr-4">
              <input type="checkbox" [(ngModel)]="config().supportedLanguages.de" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
              <span class="ml-2 text-sm text-gray-700">German</span>
            </label>
            <label class="inline-flex items-center mr-4">
              <input type="checkbox" [(ngModel)]="config().supportedLanguages.en" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
              <span class="ml-2 text-sm text-gray-700">English</span>
            </label>
            <label class="inline-flex items-center mr-4">
              <input type="checkbox" [(ngModel)]="config().supportedLanguages.ar" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
              <span class="ml-2 text-sm text-gray-700">Arabic</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-900">Provider Settings</h2>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Min Hourly Rate</label>
            <input type="number" [(ngModel)]="config().minHourlyRate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Max Hourly Rate</label>
            <input type="number" [(ngModel)]="config().maxHourlyRate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          </div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700">Provider Approval Required</span>
          <button type="button" (click)="config().providerApprovalRequired = !config().providerApprovalRequired"
            [class.bg-indigo-600]="config().providerApprovalRequired" [class.bg-gray-200]="!config().providerApprovalRequired"
            class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
            <span aria-hidden="true" [class.translate-x-5]="config().providerApprovalRequired" [class.translate-x-0]="!config().providerApprovalRequired"
              class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
          </button>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Escrow Hold Duration (days)</label>
          <input type="number" [(ngModel)]="config().escrowHoldDurationDays" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Auto Cancel Timeout (hours)</label>
          <input type="number" [(ngModel)]="config().autoCancelTimeoutHours" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-900">Review Settings</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Review Min Length (chars)</label>
          <input type="number" [(ngModel)]="config().reviewMinLength" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Review Moderation Mode</label>
          <div class="space-y-2">
            <label class="flex items-center">
              <input type="radio" name="modMode" value="auto-approve" [(ngModel)]="config().reviewModerationMode" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
              <span class="ml-3 block text-sm font-medium text-gray-700">Auto Approve</span>
            </label>
            <label class="flex items-center">
              <input type="radio" name="modMode" value="manual-approve" [(ngModel)]="config().reviewModerationMode" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
              <span class="ml-3 block text-sm font-medium text-gray-700">Manual Approve</span>
            </label>
            <label class="flex items-center">
              <input type="radio" name="modMode" value="auto-flag" [(ngModel)]="config().reviewModerationMode" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
              <span class="ml-3 block text-sm font-medium text-gray-700">Auto Flag (ML Moderation)</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6" [class.border-rose-300]="config().maintenanceMode" [class.bg-rose-50]="config().maintenanceMode">
      <h2 class="text-lg font-semibold mb-4 text-gray-900">Maintenance</h2>
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-700">Maintenance Mode</span>
          <button type="button" (click)="config().maintenanceMode = !config().maintenanceMode"
            [class.bg-rose-600]="config().maintenanceMode" [class.bg-gray-200]="!config().maintenanceMode"
            class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
            <span aria-hidden="true" [class.translate-x-5]="config().maintenanceMode" [class.translate-x-0]="!config().maintenanceMode"
              class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
          </button>
        </div>
        <div *ngIf="config().maintenanceMode">
          <label class="block text-sm font-medium text-gray-700">Maintenance Message</label>
          <textarea [(ngModel)]="config().maintenanceMessage" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500 sm:text-sm"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="flex justify-end pt-4">
    <button type="button" (click)="saveConfig()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
      Save Configuration
    </button>
  </div>
</div>
